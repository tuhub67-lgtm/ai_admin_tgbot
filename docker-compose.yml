services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/podkhvat.db
    volumes:
      - ./data:/app/data          # SQLite остаётся на хосте (бэкапить эту папку)
      - ./certs:/app/certs:ro     # сертификат НУЦ Минцифры для GigaChat (вариант А)
    expose:
      - "8000"

  caddy:
    # Образ собирает витрину+кабинет (Vite) и раздаёт SPA + проксирует API/вебхуки.
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Ежедневный бэкап SQLite в ./backups (03:00 контейнерного времени UTC — см. скрипт).
  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache sqlite >/dev/null 2>&1; while true; do /bin/sh /backup.sh; sleep 86400; done"]

volumes:
  caddy_data:
  caddy_config:
