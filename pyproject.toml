[project]
name = "podkhvat"
version = "0.1.0"
description = "Подхват — мультиарендный ИИ-администратор для клиник (Telegram + веб-виджет + SMS-возврат пропущенных звонков)"
requires-python = ">=3.12"
dependencies = [
    # Точные пины для критичных контрактов (сверено с PyPI, июль 2026):
    "aiogram==3.29.0",
    # ВНИМАНИЕ: 0.2.2a3 — пре-релиз, но именно в нём живёт новый контракт
    # client.chat.create/achat.create + ChatCompletionRequest. Стабильный
    # 0.2.1 содержит только легаси-поверхность. Пин не ослаблять до >=.
    "gigachat==0.2.2a3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "aiosqlite>=0.20",
    "pydantic>=2.7,<3",
    "apscheduler>=3.10,<4",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv]
# gigachat пинится на пре-релиз — разрешаем uv его ставить
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
